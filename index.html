<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="theme-color-meta" name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Agenda</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("agenda:theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.getElementById("theme-color-meta");
      if (meta) meta.setAttribute("content", theme === "dark" ? "#221f1c" : "#ffffff");
    })();
  </script>
</head>
<body>
  <button
    id="feed-sidebar-toggle"
    class="sidebar-toggle-btn"
    type="button"
    aria-label="mostrar feeds"
    aria-expanded="false"
    aria-controls="feed-sidebar"
    hidden
  >☰</button>

  <aside id="feed-sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">feeds</div>
    <ul id="feed-sidebar-list" class="sidebar-feed-list"></ul>
  </aside>

  <header class="app-header">
    <h1 class="site-title">🗓️ Agenda</h1>
    <div class="header-actions">
      <button id="feed-saved-toggle" class="theme-toggle" type="button" aria-label="ver itens salvos do feed" title="itens salvos do feed" hidden>☆</button>
      <button id="github-config-btn" class="theme-toggle" type="button" aria-label="configurar sincronização com GitHub" title="configurar sincronização com GitHub">🔑</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="alternar tema">☀</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="view-tabs">
      <button class="view-tab" data-view="feed" type="button">feed</button>
      <button class="view-tab" data-view="lista" type="button">lista</button>
      <button class="view-tab" data-view="calendario" type="button">calendário</button>
      <button class="view-tab" data-view="lugares" type="button">lugares</button>
    </div>

    <div class="toolbar-actions">
      <div class="filters" id="filtros-eventos">
        <select id="filtro-categoria">
          <option value="">categoria</option>
        </select>
        <select id="filtro-bairro">
          <option value="">bairro</option>
        </select>
        <select id="filtro-fonte">
          <option value="">lugar</option>
        </select>
      </div>

      <button id="btn-toggle-salvos" class="btn" type="button" hidden>★ salvos</button>
      <button id="btn-add-evento" class="btn btn-primary" type="button">+ adicionar evento</button>
      <button id="btn-add-lugar" class="btn btn-primary" type="button" hidden>+ adicionar lugar</button>
    </div>
  </div>

  <main id="app">
    <form id="form-add-evento" class="form-panel" hidden>
      <h2 id="form-evento-titulo">adicionar evento manualmente</h2>

      <div class="form-row">
        <label for="form-fonte">lugar</label>
        <select id="form-fonte" required></select>
      </div>

      <div class="form-row">
        <label for="form-titulo">título</label>
        <input id="form-titulo" type="text" required />
      </div>

      <div class="form-row">
        <label for="form-inicio">data/hora de início</label>
        <input id="form-inicio" type="datetime-local" required />
      </div>

      <div class="form-row">
        <label for="form-fim">data/hora de fim (opcional)</label>
        <input id="form-fim" type="datetime-local" />
      </div>

      <div class="form-row">
        <label for="form-preco">preço (opcional)</label>
        <select id="form-preco">
          <option value="">não informado</option>
          <option value="gratis">grátis</option>
          <option value="pago">pago</option>
        </select>
      </div>

      <div class="form-row">
        <label for="form-url">link (opcional)</label>
        <input id="form-url" type="url" placeholder="https://..." />
      </div>

      <div class="form-row">
        <label for="form-descricao">descrição (opcional)</label>
        <textarea id="form-descricao" rows="2"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="form-evento-submit-btn">salvar evento</button>
        <button type="button" id="btn-cancel-evento" class="btn">cancelar</button>
      </div>
    </form>

    <form id="form-lugar" class="form-panel" hidden>
      <h2 id="form-lugar-titulo">adicionar lugar</h2>

      <div class="form-row">
        <label for="form-lugar-nome">nome</label>
        <input id="form-lugar-nome" type="text" required />
      </div>

      <div class="form-row">
        <label for="form-lugar-categoria">categoria</label>
        <select id="form-lugar-categoria" required></select>
      </div>

      <div class="form-row">
        <label for="form-lugar-bairro">bairro (opcional)</label>
        <input id="form-lugar-bairro" type="text" />
      </div>

      <div class="form-row">
        <label for="form-lugar-subcategoria">subcategoria (opcional)</label>
        <input id="form-lugar-subcategoria" type="text" />
      </div>

      <div class="form-row">
        <label for="form-lugar-url">site (opcional)</label>
        <input id="form-lugar-url" type="url" placeholder="https://..." />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="form-lugar-submit-btn">salvar lugar</button>
        <button type="button" id="btn-cancel-lugar" class="btn">cancelar</button>
      </div>
    </form>

    <div id="conteudo"></div>
  </main>

  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
